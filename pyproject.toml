[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brawler-mcp-server-python"
version = "0.1.0"
description = "FastMCP wrapper that tags agent task tools for Brawler and other MCP clients."
authors = [
    { name = "Daniel Flores Díaz", email = "danielfloresdiaz17@gmail.com"},
]
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1.1,<5",
]

[project.urls]
Homepage = "https://github.com/DanielFloresDiaz/brawler-mcp-server-python"
Source = "https://github.com/DanielFloresDiaz/brawler-mcp-server-python"
Documentation = "https://github.com/DanielFloresDiaz/brawler-mcp-server-python#readme"

[project.scripts]
brawler-mcp-example = "examples.example:main"
brawler-mcp-task-server = "examples.task_server:main"

[tool.hatch.build.targets.wheel]
packages = ["brawler_mcp_server", "examples"]

[dependency-groups]
lint = [
    "pre-commit>=4.5.0",
    "pyright>=1.1.388",
    "ruff>=0.6.9",
]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
    "pytest-cov==6.0.0",
    "coverage>=7.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = [
    "Q",
    "RUF100",
    "C90",
    "UP",
    "I",
    "D",
]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
isort = { combine-as-imports = true }
mccabe = { max-complexity = 15 }
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D205",
    "UP040",
    "UP007",
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F403", "E712", "F405"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = false
quote-style = "single"

[tool.pytest.ini_options]
testpaths = "tests"
asyncio_mode = "auto"
xfail_strict = true
filterwarnings = [
    "error",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # FastMCP/auth may import short HS256 oct keys in tests; joserfc warns but still works.
    "ignore::joserfc.errors.SecurityWarning",
]

[tool.coverage.run]
omit = [
    "*/__init__.py",
    "examples/*",
    "brawler_mcp_server/testkit.py",
]
source = [
    "brawler_mcp_server",
]

[tool.coverage.report]
skip_covered = true
show_missing = true
ignore_errors = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "if __name__ == .__main__.:",
]

[tool.uv]
exclude-newer = "1 week"
default-groups = ["dev"]
